<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Narrative analysis architecture</title><desc id="desc">Article and label descriptions share a frozen multilingual encoder. Label vectors pass through a trained hierarchical GNN. A scoring head combines article and label vectors, then selects evidence for an explanation. The official-taxonomy browser prototype is a separate zero-shot matching path.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#55717e"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#193343}.title{font-size:20px;font-weight:600}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#536b78}.line{fill:none;stroke:#55717e;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1200" height="640" fill="white"/><text x="30" y="32" class="title">Cross-lingual transformer + hierarchical label-graph GNN</text><rect x="30" y="55" width="1140" height="65" rx="7" fill="#f1f5f7" stroke="#d5e0e5"/><text x="48" y="80" class="label">Offline training</text><text x="48" y="102" class="small">Public datasets → Spark SQL audit → train the label GNN and article projection; the multilingual encoder stays frozen.</text><rect x="30" y="175" width="190" height="82" rx="7" fill="#f7f9fb" stroke="#cbd8df"/><text x="44" y="200" class="label">1 · Article text</text><text x="44" y="222" class="small">UTF-8 news article</text><text x="44" y="240" class="small">Preserve source wording</text><rect x="30" y="325" width="190" height="102" rx="7" fill="#f7f9fb" stroke="#cbd8df"/><text x="44" y="350" class="label">Label taxonomy</text><text x="44" y="372" class="small">Names and definitions</text><text x="44" y="390" class="small">Parent–child links</text><text x="44" y="408" class="small">CARDS / ProBel in studies</text><rect x="280" y="225" width="200" height="105" rx="7" fill="#eaf4f5" stroke="#267785"/><text x="294" y="250" class="label">2 · Shared encoder</text><text x="294" y="272" class="small">Multilingual MiniLM</text><text x="294" y="290" class="small">or frozen XLM-R</text><text x="294" y="308" class="small">Text → embedding vectors</text><rect x="535" y="170" width="170" height="62" rx="7" fill="#f7f9fb" stroke="#cbd8df"/><text x="549" y="195" class="label">Article vector</text><text x="549" y="217" class="small">Learned projection</text><rect x="535" y="320" width="170" height="62" rx="7" fill="#f7f9fb" stroke="#cbd8df"/><text x="549" y="345" class="label">Label vectors</text><text x="549" y="367" class="small">Semantic initialization</text><rect x="745" y="300" width="185" height="110" rx="7" fill="#eaf4f5" stroke="#267785"/><text x="759" y="325" class="label">3 · Label GNN</text><text x="759" y="347" class="small">Two graph-convolution</text><text x="759" y="365" class="small">layers exchange parent /</text><text x="759" y="383" class="small">child label information</text><rect x="970" y="175" width="200" height="98" rx="7" fill="#eaf4f5" stroke="#267785"/><text x="984" y="200" class="label">4 · Score labels</text><text x="984" y="222" class="small">Compare article and</text><text x="984" y="240" class="small">graph label vectors</text><text x="984" y="258" class="small">Decode labels + parents</text><rect x="970" y="330" width="200" height="65" rx="7" fill="#f7f9fb" stroke="#cbd8df"/><text x="984" y="355" class="label">Predicted categories</text><text x="984" y="377" class="small">Native dataset taxonomy</text><rect x="745" y="455" width="185" height="76" rx="7" fill="#f7f9fb" stroke="#cbd8df"/><text x="759" y="480" class="label">5 · Evidence</text><text x="759" y="502" class="small">Rank source sentences</text><text x="759" y="520" class="small">Retain neighboring context</text><rect x="970" y="455" width="200" height="76" rx="7" fill="#f7f9fb" stroke="#cbd8df"/><text x="984" y="480" class="label">6 · Explanation</text><text x="984" y="502" class="small">Qwen + selected evidence</text><text x="984" y="520" class="small">At most 80 words</text><path d="M220 214 H248 V257 H280" class="line"/><path d="M220 355 H250 V302 H280" class="line"/><path d="M480 250 H505 V201 H535" class="line"/><path d="M480 305 H505 V351 H535" class="line"/><path d="M705 201 H970" class="line"/><path d="M705 351 H745" class="line"/><path d="M930 350 H1068 V273" class="line"/><path d="M1068 273 V330" class="line"/><path d="M1068 395 V425 H838 V455" class="line"/><path d="M930 493 H970" class="line"/><path d="M220 410 H717 V393 H745" class="line" stroke-dasharray="5 5"/><path d="M125 257 V493 H745" class="line" stroke-dasharray="5 5"/><text x="280" y="475" class="small">Original article text</text><rect x="30" y="565" width="1140" height="60" rx="7" fill="#fff8ec" stroke="#ddc69d"/><text x="48" y="589" class="label">Official-taxonomy article test · separate zero-shot prototype</text><text x="48" y="610" class="small">Multilingual encoder → 96-label retrieval → entailment check → hierarchy checks → source evidence. Auxiliary trained GNN heads are not used in this mode.</text></svg>